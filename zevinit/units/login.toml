[unit]
description = "Console login"
requires = ["devtmpfs.service"]
wants = ["zevlog.service"]
after = ["devtmpfs.service", "zevlog.service"]
conflicts = ["rescue.service"]

[service]
kind = "simple"
start = "/sbin/getty 38400 tty1"
restart = "always"
restart_delay = 1
restart_limit = 10
directory = "/"
